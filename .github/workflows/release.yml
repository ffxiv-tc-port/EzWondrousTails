# 台服 (TC) 發版（ezWondrousTails / InternalName: WondrousTailsSolver）。
# 由 release_plugin.py 以 workflow_dispatch 觸發，Dalamud 釘在 API13 (dalamud-pin-v13.0.0.16)。
# ⚠️ KamiToolKit 子模組是私有的 ffxiv-tc-port/KamiToolKit，需要 repo secret PRIVATE_SUBMODULE_TOKEN。
name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN || github.token }}
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with dotnet
        run: dotnet build --configuration Release WondrousTailsSolver/WondrousTailsSolver.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './WondrousTailsSolver/bin/Release/WondrousTailsSolver/WondrousTailsSolver.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to WondrousTailsSolver.zip
        shell: pwsh
        run: |
          # 明確路徑，不做遞迴搜尋：本 repo 會 checkout 子模組，別的 latest.zip 會被誤取。
          Copy-Item "./WondrousTailsSolver/bin/Release/WondrousTailsSolver/latest.zip" -Destination "WondrousTailsSolver.zip"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            WondrousTailsSolver.zip
            WondrousTailsSolver/bin/Release/WondrousTailsSolver/WondrousTailsSolver.json
          generate_release_notes: true

# workflow 索引觸發：GitHub 只在 push 實際變動到 workflow 檔本身時才建索引。
